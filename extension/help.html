<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Sideflow — 表示できない場合</title><link rel="stylesheet" href="newtab.css"></head><body><main><h1>このタブには表示できません</h1><p>Chrome設定・拡張管理・Webストア・他の拡張の画面には、Sideflowのスワイプ処理を追加できません。</p><p>通常のWebページなら、拡張更新後にページを再読み込みし、Sideflowのサイトへのアクセス許可を確認してください。</p><p>新規タブが他の拡張の画面になる場合は、Chromeの拡張管理で新規タブを変更する拡張を確認してください。</p><a href="newtab.html">Sideflowの新規タブを開く</a></main></body></html>
