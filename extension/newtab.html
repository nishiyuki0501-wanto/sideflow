<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新しいタブ — Sideflow</title><link rel="stylesheet" href="newtab.css"></head>
<body><main><span class="wordmark">SIDEFLOW</span><h1>次のアイデアへ。</h1><form id="search"><input id="query" aria-label="検索またはURLを入力" placeholder="検索またはURLを入力" autocomplete="off"><button type="submit">開く ↗</button></form><button id="open-sidebar" type="button">サイドバーを開く</button><p>ツールバーのSideflowアイコン、またはAlt/Option＋Shift＋Sで開く</p><details class="customize"><summary>ページをカスタマイズ</summary><label>テーマ <select id="page-theme" aria-label="テーマ"><option value="blue">ブルー</option><option value="lavender">ラベンダー</option><option value="forest">フォレスト</option><option value="dark">ダーク</option></select></label><label>見出し <input id="page-heading" maxlength="80" placeholder="次のアイデアへ。"></label><button id="save-page" type="button">保存</button><span id="page-status" role="status"></span></details></main><script src="newtab.js"></script></body></html>
